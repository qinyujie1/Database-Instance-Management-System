{% extends "admin/change_list.html" %}
{% block content %}<div class="console"><div class="notice"><form method="get" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0">{% for key,value in sort_filters %}<input type="hidden" name="{{ key }}" value="{{ value }}">{% endfor %}<label for="instance-sort"><b>显示排序</b></label><select id="instance-sort" name="o" style="min-height:36px;height:auto;padding:6px 10px">{% if sort_is_custom %}<option value="{{ current_sort }}" selected>表头组合排序</option>{% endif %}{% for value,label in sort_options %}<option value="{{ value }}" {% if current_sort == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select><button class="primary" type="submit">应用排序</button><span>当前：{{ sort_summary }}</span></form><div style="margin-top:9px;font-size:12px">也可点击表头切换升序 / 降序。排序应用于全部匹配实例；切换排序保留搜索与筛选，并回到第一页。宽表格可左右滚动查看。</div></div></div>{{ block.super }}{% endblock %}
{% block extrastyle %}{{ block.super }}<style>#changelist .results{overflow-x:auto}#result_list{min-width:1250px}#result_list th,#result_list td{white-space:nowrap}#result_list .column-name,#result_list .field-name{min-width:140px}#result_list .column-operations,#result_list .field-operations{min-width:190px}#result_list thead th.sortable .text a:after{content:" ↕";opacity:.5;font-size:12px}#result_list thead th.sorted.ascending .text a:after{content:" ↑";opacity:1}#result_list thead th.sorted.descending .text a:after{content:" ↓";opacity:1}</style>{% endblock %}
